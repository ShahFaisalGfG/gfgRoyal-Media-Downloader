name: Tests

# Runs on every push and pull request: the whole app on Windows (Qt offscreen, pyright, the QML
# linter), the engine and command-line tool on Windows and Linux, and the companion extension.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      # pyright is pinned in requirements.txt.
      - name: Type-check with pyright
        shell: pwsh
        run: |
          pyright gfgmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lint QML
        shell: pwsh
        run: |
          $files = (Get-ChildItem gfgmd/qml -Recurse -Filter *.qml).FullName
          pyside6-qmllint -I gfgmd/qml -I gfgmd/qml/components @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The engine and the command-line tool need only the standard library, so they are tested
  # without PySide6, on both systems the tool supports.
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run engine and command-line tests
        run: python -m pytest tests/core tests/test_cli.py -q

  companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
