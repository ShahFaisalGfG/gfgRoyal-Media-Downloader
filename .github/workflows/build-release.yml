name: Build and Release

# Triggered by pushing a version tag, e.g.: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    permissions:
      contents: write  # gh release create

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      # Single source of truth: all metadata comes from pyproject.toml
      - name: Read app metadata
        id: meta
        shell: pwsh
        run: |
          . .\scripts\common.ps1
          $m = Get-AppMeta
          "VER=$($m.Version)"        | Out-File $env:GITHUB_OUTPUT -Append
          "APP_NAME=$($m.AppName)"   | Out-File $env:GITHUB_OUTPUT -Append
          "FILE_NAME=$($m.FileName)" | Out-File $env:GITHUB_OUTPUT -Append

      # Release files are named after pyproject's version and the release after the tag, so the
      # two must agree, and the release notes for that version must exist.
      - name: Check the tag matches the version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          if ($env:TAG -ne "v$env:VER") {
            Write-Error "Tag $env:TAG does not match pyproject.toml version (v$env:VER)."
            exit 1
          }
          if (-not (Test-Path "release_notes/release_notes_v$env:VER.md")) {
            Write-Error "release_notes/release_notes_v$env:VER.md is missing."
            exit 1
          }

      # A local staging build points the updater at a test server and a test key
      # (scripts\bundle.ps1 -UpdateFeed); that file must never reach a release.
      - name: Check no staging update feed is present
        shell: pwsh
        run: |
          if (Test-Path gfgmd\config\update_staging.py) {
            Write-Error "gfgmd\config\update_staging.py is a local test file; delete it before releasing."
            exit 1
          }

      - name: Install Python dependencies
        shell: pwsh
        run: pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      # Bundles the app into dist\gfgRoyal-Media-Downloader\ (onedir, used by both installers and the
      # portable .7z) and runs the frozen exe with --self-test, then adds gfgmd.exe (the command-line
      # tool) and the companion's native-messaging host beside it.
      - name: Build and verify the app bundle
        shell: pwsh
        env:
          FILE_NAME: ${{ steps.meta.outputs.FILE_NAME }}
        run: |
          . .\scripts\bundle.ps1
          $null = New-AppBundle -Name $env:FILE_NAME -Mode onedir -DistPath "dist"
          New-ConsoleExes -BundleDir "dist\$env:FILE_NAME"

      # Pinned, so every release compiles with the same Inno Setup. "upgrade" with
      # --allow-downgrade installs exactly this version whether or not the image has another.
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco upgrade innosetup --version=6.7.1 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed (exit $LASTEXITCODE)" }

      - name: Build installers
        shell: pwsh
        run: |
          . .\scripts\common.ps1
          $meta = Get-AppMeta
          foreach ($kind in "System", "User") { $null = Invoke-Iscc -Kind $kind -Meta $meta }

      # Single-file portable exe, verified the same way as the onedir bundle
      - name: Build and verify the portable exe
        shell: pwsh
        env:
          FILE_NAME: ${{ steps.meta.outputs.FILE_NAME }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          . .\scripts\bundle.ps1
          $null = New-AppBundle -Name "${env:FILE_NAME}_${env:VER}_portable" -Mode onefile -DistPath "build"

      # The portable .7z is the onedir bundle (with gfgmd.exe) plus the marker that keeps its data
      # beside it, and the licence texts.
      - name: Create the portable archive
        shell: pwsh
        env:
          FILE_NAME: ${{ steps.meta.outputs.FILE_NAME }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          . .\scripts\bundle.ps1
          New-PortableArchive -BundleDir "dist\$env:FILE_NAME" -ArchivePath "build\${env:FILE_NAME}_${env:VER}_portable.7z"

      # The companion browser extension's store package, for loading unpacked or uploading.
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Build the companion extension
        shell: pwsh
        working-directory: companion
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed (exit $LASTEXITCODE)" }
          npm run zip
          if ($LASTEXITCODE -ne 0) { throw "npm run zip failed (exit $LASTEXITCODE)" }

      # update.json lists what the in-app updater installs (each installer and the portable exe,
      # with sizes and SHA-256 hashes) and is signed with UPDATE_SIGNING_KEY. --expect stops a
      # release signed with a key the app doesn't carry, which no installed copy could verify.
      # The portable .7z isn't listed: that copy can't replace itself and links to the release.
      - name: Write and sign the update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          APP_NAME: ${{ steps.meta.outputs.APP_NAME }}
          FILE_NAME: ${{ steps.meta.outputs.FILE_NAME }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          python -m pip install "cryptography>=46"
          if ($LASTEXITCODE -ne 0) { throw "pip install failed (exit $LASTEXITCODE)" }
          $base = "${env:FILE_NAME}_${env:VER}"
          python scripts\make_update_manifest.py --app $env:APP_NAME --version $env:VER `
            --repo $env:GITHUB_REPOSITORY --out build\update.json `
            --package "kind=system;files=build\installer\${base}_system_installer.exe" `
            --package "kind=user;files=build\installer\${base}_user_installer.exe" `
            --package "kind=portable-exe;files=build\${base}_portable.exe"
          if ($LASTEXITCODE -ne 0) { throw "make_update_manifest.py failed (exit $LASTEXITCODE)" }
          python scripts\sign_update.py build\update.json --expect gfgmd\config\defaults.py
          if ($LASTEXITCODE -ne 0) { throw "sign_update.py failed (exit $LASTEXITCODE)" }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APP_NAME: ${{ steps.meta.outputs.APP_NAME }}
          FILE_NAME: ${{ steps.meta.outputs.FILE_NAME }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          $base = "${env:FILE_NAME}_${env:VER}"
          $companion = (Get-ChildItem companion\.output -Filter *.zip | Select-Object -First 1).FullName
          if (-not $companion) { throw "The companion extension zip is missing" }
          gh release create $env:TAG `
            --title "$env:APP_NAME v$env:VER" `
            --notes-file "release_notes/release_notes_v$env:VER.md" `
            "build\installer\${base}_system_installer.exe" `
            "build\installer\${base}_user_installer.exe" `
            "build\${base}_portable.exe" `
            "build\${base}_portable.7z" `
            $companion `
            "build\update.json" `
            "build\update.json.sig"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)" }
